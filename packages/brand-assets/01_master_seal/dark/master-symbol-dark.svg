<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" fill="none">
  <!-- Master Symbol (Dark Base): The Dynamic Wing-Sail (바람을 가르는 비대칭 돛) -->
  <rect width="400" height="400" rx="16" fill="#060911" />

  <g transform="translate(195, 205)">
    <!-- 01. Seed Origin Pod (Gold Core) -->
    <path d="M -16,72 C -24,58 -22,44 -14,38 C -6,44 -2,58 -16,72 Z" fill="#ffd166" stroke="#f59e0b" stroke-width="1.2" />
    <circle cx="-14" cy="52" r="2" fill="#ffffff" />

    <!-- 02. The Main Mast (Crisp White curving forward) -->
    <path d="M -14,38 C -2,12 14,-25 8,-85" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />

    <!-- 03. Primary Main Sail (Sweeping aerodynamic wing) -->
    <path d="M -4,22 C -42,5 -75,-15 -85,-55 C -65,-46 -35,-42 3,-45 Z" 
          stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" fill="#ffffff" fill-opacity="0.06" />
    <!-- Sail Internal Gold Tension Spine -->
    <path d="M -9,12 C -32,-6 -55,-20 -66,-42" stroke="#ffd166" stroke-width="2" stroke-linecap="round" />

    <!-- 04. Top Jib Sail (Secondary upper aerodynamic feather) -->
    <path d="M 3,-24 C -22,-40 -44,-58 -52,-88 C -38,-80 -18,-74 7,-72 Z" 
          stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" fill="#ffffff" fill-opacity="0.06" />

    <!-- 05. Leading Whispering Breeze Line (Dash) -->
    <path d="M 8,-85 C 26,-58 40,-32 46,-2" stroke="#ffd166" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.8" />

    <!-- Apex Lift Core -->
    <circle cx="8" cy="-85" r="4.5" fill="#ffd166" />
    <circle cx="6" cy="-87" r="1.5" fill="#ffffff" />
  </g>
</svg>
