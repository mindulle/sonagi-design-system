<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: -apple-system, sans-serif; padding: 20px; margin: 0; background: #fdfdfd; }
    h3 { margin-top: 0; margin-bottom: 8px; color: #111; }
    p { font-size: 13px; color: #666; line-height: 1.4; margin-bottom: 24px; }
    input { width: 100%; margin-top: 8px; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; }
    button { width: 100%; margin-top: 16px; padding: 12px; background: #0d99ff; color: #fff; border: none; cursor: pointer; border-radius: 6px; font-weight: bold; }
    button:hover { background: #007be5; }
    #status { margin-top: 16px; font-size: 13px; font-weight: bold; text-align: center; }
  </style>
</head>
<body>
  <h3>Sonagi Token Sync (Local) 🚀</h3>
  <p>피그마의 최신 변수를 <b>원격 작업 환경(gp66-1)</b>으로 곧바로 쏴줍니다.</p>
  
  <label style="font-size: 12px; font-weight: 600;">Sync Server URL (gp66-1 주소)</label>
  <input type="text" id="server-url" value="http://localhost:3000" />
  
  <button id="push-btn">동기화 시작 (Push to Server)</button>
  <div id="status"></div>

  <hr style="margin: 20px 0; border: none; border-top: 1px solid #eee;" />
  <div style="font-size: 12px; display: flex; align-items: center; justify-content: space-between;">
    <span style="font-weight: 600;">Agent Bridge (Zero-Click)</span>
    <span id="bridge-badge" style="font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 4px; background: #fee2e2; color: #b91c1c;">연결 중...</span>
  </div>
  <p id="bridge-log" style="font-size: 11px; color: #888; margin-top: 4px; margin-bottom: 0;">Tailscale: ws://100.91.9.83:3050</p>

  <script>
    // --- Agent Bridge WebSocket Connection ---
    const BRIDGE_WS_URL = 'ws://100.91.9.83:3050';
    let bridgeWs = null;

    function initBridge() {
      const badge = document.getElementById('bridge-badge');
      const log = document.getElementById('bridge-log');

      try {
        bridgeWs = new WebSocket(BRIDGE_WS_URL);

        bridgeWs.onopen = () => {
          badge.style.background = '#dcfce7';
          badge.style.color = '#15803d';
          badge.innerText = '🟢 Agent Live';
          log.innerText = 'Connected: ws://100.91.9.83:3050';
        };

        bridgeWs.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);
            if (data.type === 'execute-script') {
              log.innerText = '⚡ 스크립트 실행 중...';
              parent.postMessage({ pluginMessage: { type: 'execute-script', script: data.script || data.payload } }, '*');
            }
          } catch (e) {
            log.innerText = 'Error: ' + e.message;
          }
        };

        bridgeWs.onclose = () => {
          badge.style.background = '#fee2e2';
          badge.style.color = '#b91c1c';
          badge.innerText = '🔴 오프라인';
          log.innerText = '재연결 시도 중...';
          setTimeout(initBridge, 3000);
        };

        bridgeWs.onerror = () => {
          bridgeWs.close();
        };
      } catch (err) {
        setTimeout(initBridge, 3000);
      }
    }

    initBridge();

    document.getElementById('push-btn').onclick = () => {
      document.getElementById('status').style.color = "#333";
      document.getElementById('status').innerText = "⏳ 1/2: 피그마에서 변수 추출 중...";
      parent.postMessage({ pluginMessage: { type: 'extract-tokens' } }, '*');
    };

    onmessage = async (event) => {
      const msg = event.data.pluginMessage;
      
      if (msg.type === 'error') {
        document.getElementById('status').style.color = "red";
        document.getElementById('status').innerText = "❌ 추출 실패: " + msg.payload;
        return;
      }

      if (msg.type === 'tokens-ready') {
        document.getElementById('status').innerText = "🚀 2/2: gp66-1 머신으로 전송 중...";
        
        let serverUrl = document.getElementById('server-url').value.replace(/\/$/, ""); // 뒤쪽 슬래시 제거
        const payloadData = msg.payload;

        try {
          const response = await fetch(`${serverUrl}/sync`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payloadData)
          });

          if (response.ok) {
            document.getElementById('status').style.color = "green";
            document.getElementById('status').innerHTML = "✅ gp66-1 파일 덮어쓰기 완료!";
          } else {
            document.getElementById('status').style.color = "red";
            document.getElementById('status').innerText = `❌ 전송 실패 (${response.status})`;
          }
        } catch (err) {
          document.getElementById('status').style.color = "red";
          document.getElementById('status').innerText = "❌ 네트워크 오류 (서버 주소를 확인하세요): " + err.message;
        }
      }
    };
  </script>
</body>
</html>
