<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" fill="none">
  <!-- Concept 3: The Kinetic Seed Vortex (회전과 확산의 기하학) -->
  <rect width="400" height="400" rx="16" fill="#faf8f5" />

  <g transform="translate(200, 200)">
    <!-- Central Golden Core -->
    <circle cx="0" cy="0" r="6" fill="#d97706" />

    <!-- 3-Fold Dynamic Wind Arcs (Fibonacci Swirl) -->
    <!-- Blade 1 (Top-Right) -->
    <path d="M 0,-8 C 30,-30 65,-25 80,-5 C 90,15 75,50 45,65 C 25,45 10,20 0,0" 
          stroke="#1c1514" stroke-width="2.5" stroke-linejoin="round" fill="#1c1514" fill-opacity="0.04" />
    <path d="M 25,12 C 45,25 60,10 65,-5" stroke="#d97706" stroke-width="1.8" stroke-linecap="round" />

    <!-- Blade 2 (Bottom-Left) -->
    <g transform="rotate(120)">
      <path d="M 0,-8 C 30,-30 65,-25 80,-5 C 90,15 75,50 45,65 C 25,45 10,20 0,0" 
            stroke="#1c1514" stroke-width="2.5" stroke-linejoin="round" fill="#1c1514" fill-opacity="0.04" />
      <path d="M 25,12 C 45,25 60,10 65,-5" stroke="#d97706" stroke-width="1.8" stroke-linecap="round" />
    </g>

    <!-- Blade 3 (Top-Left) -->
    <g transform="rotate(240)">
      <path d="M 0,-8 C 30,-30 65,-25 80,-5 C 90,15 75,50 45,65 C 25,45 10,20 0,0" 
            stroke="#1c1514" stroke-width="2.5" stroke-linejoin="round" fill="#1c1514" fill-opacity="0.04" />
      <path d="M 25,12 C 45,25 60,10 65,-5" stroke="#d97706" stroke-width="1.8" stroke-linecap="round" />
    </g>
  </g>
</svg>
