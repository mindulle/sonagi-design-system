<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 160" width="840" height="160" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&amp;family=JetBrains+Mono:wght@600&amp;display=swap');
      .c3-serif { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 700; font-size: 42px; letter-spacing: 0.16em; fill: #1c1514; }
      .c3-mono { font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 12px; letter-spacing: 0.24em; fill: #9a3412; }
      .c3-accent { fill: #b45309; }
    </style>
  </defs>

  <rect width="840" height="160" rx="8" fill="#faf8f5" stroke="#1c1514" stroke-width="2" />

  <!-- Left: Concept 3 Kinetic Vortex Symbol (Scaled ~100px at translate 85, 80) -->
  <g transform="translate(85, 80) scale(0.65)">
    <!-- Central Golden Core -->
    <circle cx="0" cy="0" r="7" fill="#d97706" />

    <!-- 3-Fold Dynamic Wind Arcs (Fibonacci Swirl) -->
    <!-- Blade 1 -->
    <path d="M 0,-8 C 30,-30 65,-25 80,-5 C 90,15 75,50 45,65 C 25,45 10,20 0,0" 
          stroke="#1c1514" stroke-width="3" stroke-linejoin="round" fill="#1c1514" fill-opacity="0.04" />
    <path d="M 25,12 C 45,25 60,10 65,-5" stroke="#d97706" stroke-width="2.2" stroke-linecap="round" />

    <!-- Blade 2 -->
    <g transform="rotate(120)">
      <path d="M 0,-8 C 30,-30 65,-25 80,-5 C 90,15 75,50 45,65 C 25,45 10,20 0,0" 
            stroke="#1c1514" stroke-width="3" stroke-linejoin="round" fill="#1c1514" fill-opacity="0.04" />
      <path d="M 25,12 C 45,25 60,10 65,-5" stroke="#d97706" stroke-width="2.2" stroke-linecap="round" />
    </g>

    <!-- Blade 3 -->
    <g transform="rotate(240)">
      <path d="M 0,-8 C 30,-30 65,-25 80,-5 C 90,15 75,50 45,65 C 25,45 10,20 0,0" 
            stroke="#1c1514" stroke-width="3" stroke-linejoin="round" fill="#1c1514" fill-opacity="0.04" />
      <path d="M 25,12 C 45,25 60,10 65,-5" stroke="#d97706" stroke-width="2.2" stroke-linecap="round" />
    </g>
  </g>

  <!-- 2px Architectural Divider -->
  <line x1="165" y1="36" x2="165" y2="124" stroke="#1c1514" stroke-width="2" />

  <!-- Typography Suite -->
  <text x="195" y="80" class="c3-serif">
    MINDULLE <tspan class="c3-accent">STUDIO</tspan>
  </text>
  <text x="198" y="110" class="c3-mono">
    • SOUL &amp; HARNESS • EST. 2026 •
  </text>
</svg>
