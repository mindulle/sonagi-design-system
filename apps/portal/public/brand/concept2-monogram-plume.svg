<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" fill="none">
  <!-- Concept 2: The Monogram 'M' Plume (기하학적 'M'과 비상의 결합) -->
  <rect width="400" height="400" rx="16" fill="#faf8f5" />

  <g transform="translate(200, 205)">
    <!-- Central Lifting Core -->
    <path d="M 0,55 L 0,-65" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="0" cy="-75" r="4" fill="#d97706" />

    <!-- Left Outer Arch of 'M' -->
    <path d="M -75,60 C -75,0 -40,-45 0,-15" 
          stroke="#1c1514" stroke-width="3" stroke-linecap="round" />

    <!-- Right Outer Arch of 'M' -->
    <path d="M 75,60 C 75,0 40,-45 0,-15" 
          stroke="#1c1514" stroke-width="3" stroke-linecap="round" />

    <!-- Left Inner Wing Feather -->
    <path d="M -45,55 C -45,15 -25,-20 0,-15" 
          stroke="#1c1514" stroke-width="1.8" stroke-linecap="round" opacity="0.6" />

    <!-- Right Inner Wing Feather -->
    <path d="M 45,55 C 45,15 25,-20 0,-15" 
          stroke="#1c1514" stroke-width="1.8" stroke-linecap="round" opacity="0.6" />

    <!-- Base Horizon Ground Line (Subtle anchor) -->
    <line x1="-85" y1="62" x2="85" y2="62" stroke="#1c1514" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
