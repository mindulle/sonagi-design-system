<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap');
      .seal-text-serif {
        font-family: 'Cormorant Garamond', 'Georgia', 'Times New Roman', serif;
        font-weight: 700;
        font-size: 21px;
        letter-spacing: 0.28em;
        fill: #ffffff;
      }
      .seal-text-mono {
        font-family: 'JetBrains Mono', 'Consolas', 'Courier New', monospace;
        font-weight: 600;
        font-size: 10px;
        letter-spacing: 0.22em;
        fill: #ffd166;
      }
    </style>
    <!-- Circular Paths for Arc Text -->
    <!-- Radius 152 for Upper Arc -->
    <path id="upperArc" d="M 54,200 A 146,146 0 1,1 346,200" fill="none" />
    <!-- Radius 152 for Lower Arc (drawn left-to-right along bottom) -->
    <path id="lowerArc" d="M 64,210 A 142,142 0 0,0 336,210" fill="none" />

    <!-- Glass Refraction Gradients -->
    <radialGradient id="glassAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd166" stop-opacity="0.18" />
      <stop offset="45%" stop-color="#4A90E2" stop-opacity="0.12" />
      <stop offset="75%" stop-color="#00ffcc" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#060911" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="facetHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A90E2" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffd166" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="goldCore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff5cc" />
      <stop offset="50%" stop-color="#ffd166" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Background Base Disc -->
  <circle cx="200" cy="200" r="192" fill="#060911" />
  <circle cx="200" cy="200" r="192" fill="url(#glassAura)" />

  <!-- Outer Double Seal Rings (Sonagi 2px & 1px Precision Architecture) -->
  <circle cx="200" cy="200" r="188" stroke="#30363d" stroke-width="2" />
  <circle cx="200" cy="200" r="176" stroke="#4A90E2" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.8" />
  <circle cx="200" cy="200" r="126" stroke="#30363d" stroke-width="2" />
  <circle cx="200" cy="200" r="120" stroke="#1e2430" stroke-width="1" />

  <!-- Top Arc Text: MINDULLE STUDIO -->
  <text class="seal-text-serif">
    <textPath href="#upperArc" startOffset="50%" text-anchor="middle">
      MINDULLE STUDIO
    </textPath>
  </text>

  <!-- Bottom Arc Text: SOUL & HARNESS • EST. 2026 -->
  <text class="seal-text-mono">
    <textPath href="#lowerArc" startOffset="50%" text-anchor="middle">
      • SOUL &amp; HARNESS • EST. 2026 •
    </textPath>
  </text>

  <!-- Outer Anchor Stars / Separators -->
  <circle cx="50" cy="200" r="3.5" fill="#ffd166" />
  <circle cx="350" cy="200" r="3.5" fill="#ffd166" />
  <polygon points="50,193 52,198 57,200 52,202 50,207 48,202 43,200 48,198" fill="#ffd166" />
  <polygon points="350,193 352,198 357,200 352,202 350,207 348,202 343,200 348,198" fill="#ffd166" />

  <!-- Inner Dome: Glass Paperweight Architecture (Octagonal Cut Facets) -->
  <!-- Glass Bevel Facets (Crystalline Dome) -->
  <polygon points="200,88 279,121 312,200 279,279 200,312 121,279 88,200 121,121"
           stroke="#4A90E2" stroke-width="1.5" fill="none" opacity="0.4" />
  
  <polygon points="200,104 268,132 296,200 268,268 200,296 132,268 104,200 132,132"
           stroke="url(#facetHighlight)" stroke-width="1" fill="#090d16" fill-opacity="0.6" />

  <!-- Glass Light Refraction Lines (Diagonal Facets) -->
  <line x1="121" y1="121" x2="200" y2="200" stroke="#4A90E2" stroke-width="1" stroke-dasharray="2 3" opacity="0.35" />
  <line x1="279" y1="121" x2="200" y2="200" stroke="#4A90E2" stroke-width="1" stroke-dasharray="2 3" opacity="0.35" />
  <line x1="279" y1="279" x2="200" y2="200" stroke="#4A90E2" stroke-width="1" stroke-dasharray="2 3" opacity="0.35" />
  <line x1="121" y1="279" x2="200" y2="200" stroke="#4A90E2" stroke-width="1" stroke-dasharray="2 3" opacity="0.35" />

  <!-- Glass Dome Highlight Glint (Top Arc) -->
  <path d="M 148,148 A 74,74 0 0,1 252,148" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.5" />
  <circle cx="160" cy="154" r="2" fill="#ffffff" opacity="0.8" />

  <!-- Central Dandelion (Inside the Protected Glass Envelope) -->
  <!-- 16 Radial Pappus Filaments (Fluff Rays) -->
  <g stroke="#ffd166" stroke-width="1.2" opacity="0.85">
    <!-- North -->
    <line x1="200" y1="200" x2="200" y2="132" />
    <circle cx="200" cy="132" r="2" fill="#fff5cc" />
    <line x1="200" y1="138" x2="194" y2="132" stroke-width="0.8" />
    <line x1="200" y1="138" x2="206" y2="132" stroke-width="0.8" />

    <!-- NNE -->
    <line x1="200" y1="200" x2="226" y2="137" />
    <circle cx="226" cy="137" r="1.8" fill="#fff5cc" />

    <!-- NE -->
    <line x1="200" y1="200" x2="248" y2="152" />
    <circle cx="248" cy="152" r="2" fill="#fff5cc" />
    <line x1="242" y1="158" x2="245" y2="149" stroke-width="0.8" />
    <line x1="242" y1="158" x2="252" y2="157" stroke-width="0.8" />

    <!-- ENE -->
    <line x1="200" y1="200" x2="263" y2="174" />
    <circle cx="263" cy="174" r="1.8" fill="#fff5cc" />

    <!-- East -->
    <line x1="200" y1="200" x2="268" y2="200" />
    <circle cx="268" cy="200" r="2" fill="#fff5cc" />
    <line x1="262" y1="200" x2="268" y2="194" stroke-width="0.8" />
    <line x1="262" y1="200" x2="268" y2="206" stroke-width="0.8" />

    <!-- ESE -->
    <line x1="200" y1="200" x2="263" y2="226" />
    <circle cx="263" cy="226" r="1.8" fill="#fff5cc" />

    <!-- SE -->
    <line x1="200" y1="200" x2="248" y2="248" />
    <circle cx="248" cy="248" r="2" fill="#fff5cc" />

    <!-- SSE -->
    <line x1="200" y1="200" x2="226" y2="263" />
    <circle cx="226" cy="263" r="1.8" fill="#fff5cc" />

    <!-- South -->
    <line x1="200" y1="200" x2="200" y2="268" />
    <circle cx="200" cy="268" r="2" fill="#fff5cc" />

    <!-- SSW -->
    <line x1="200" y1="200" x2="174" y2="263" />
    <circle cx="174" cy="263" r="1.8" fill="#fff5cc" />

    <!-- SW -->
    <line x1="200" y1="200" x2="152" y2="248" />
    <circle cx="152" cy="248" r="2" fill="#fff5cc" />

    <!-- WSW -->
    <line x1="200" y1="200" x2="137" y2="226" />
    <circle cx="137" cy="226" r="1.8" fill="#fff5cc" />

    <!-- West -->
    <line x1="200" y1="200" x2="132" y2="200" />
    <circle cx="132" cy="200" r="2" fill="#fff5cc" />
    <line x1="138" y1="200" x2="132" y2="194" stroke-width="0.8" />
    <line x1="138" y1="200" x2="132" y2="206" stroke-width="0.8" />

    <!-- WNW -->
    <line x1="200" y1="200" x2="137" y2="174" />
    <circle cx="137" cy="174" r="1.8" fill="#fff5cc" />

    <!-- NW -->
    <line x1="200" y1="200" x2="152" y2="152" />
    <circle cx="152" cy="152" r="2" fill="#fff5cc" />
    <line x1="158" y1="158" x2="148" y2="157" stroke-width="0.8" />
    <line x1="158" y1="158" x2="155" y2="149" stroke-width="0.8" />

    <!-- NNW -->
    <line x1="200" y1="200" x2="174" y2="137" />
    <circle cx="174" cy="137" r="1.8" fill="#fff5cc" />
  </g>

  <!-- Central Stem & Seed Core (The Living Soul) -->
  <line x1="200" y1="200" x2="200" y2="228" stroke="url(#goldCore)" stroke-width="2.5" stroke-linecap="round" />
  <!-- Achene Seed Kernel -->
  <ellipse cx="200" cy="200" rx="6" ry="10" fill="url(#goldCore)" />
  <ellipse cx="200" cy="200" rx="3" ry="6" fill="#ffffff" opacity="0.9" />

  <!-- Micro Glow Particle Specks inside the Glass Envelope -->
  <circle cx="182" cy="170" r="1.5" fill="#ffd166" opacity="0.7" />
  <circle cx="218" cy="174" r="1.2" fill="#4A90E2" opacity="0.8" />
  <circle cx="178" cy="225" r="1.5" fill="#4A90E2" opacity="0.7" />
  <circle cx="222" cy="220" r="1.2" fill="#ffd166" opacity="0.8" />
</svg>
