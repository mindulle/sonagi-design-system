<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" fill="none">
  <!-- Candidate 3: The Purifier Prism (다이아몬드 정화 렌즈) -->
  <rect width="400" height="400" rx="16" fill="#faf8f5" />

  <g transform="translate(200, 200)">
    <!-- Outer Rhombus / Diamond Lens (2.5px Deep Ink) -->
    <polygon points="0,-90 75,0 0,90 -75,0" stroke="#1c1514" stroke-width="3" stroke-linejoin="round" fill="#1c1514" fill-opacity="0.04" />

    <!-- Interior Droplet (Rain Blue #2563eb) -->
    <path d="M 0,-50 C 0,-50 40,5 40,30 C 40,52 22,65 0,65 C -22,65 -40,52 -40,30 C -40,5 0,-50 0,-50 Z" 
          stroke="#2563eb" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- Center Gold Core -->
    <circle cx="0" cy="30" r="7" fill="#d97706" />
    <circle cx="-1.5" cy="28.5" r="2" fill="#ffffff" />
  </g>
</svg>
