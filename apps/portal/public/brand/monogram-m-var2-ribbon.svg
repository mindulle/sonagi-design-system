<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" fill="none">
  <!-- Variation 2: The Continuous Ribbon 'M' (단절 없는 기하학 리본 M) -->
  <rect width="400" height="400" rx="16" fill="#faf8f5" />

  <g transform="translate(200, 205)">
    <!-- Continuous Unbroken Stroke of 'M' -->
    <path d="M -70,55 C -70,-25 -45,-55 -25,-55 C -5,-55 0,-15 0,-15 C 0,-15 5,-55 25,-55 C 45,-55 70,-25 70,55" 
          stroke="#1c1514" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Inner Ribbon Shadow Overlay -->
    <path d="M -45,55 C -45,-5 -30,-30 -15,-30 C -2,-30 0,-15 0,-15 C 0,-15 2,-30 15,-30 C 30,-30 45,-5 45,55" 
          stroke="#1c1514" stroke-width="1.8" stroke-linecap="round" opacity="0.25" />

    <!-- Center Floating Golden Seed Core -->
    <circle cx="0" cy="15" r="7" fill="#d97706" />
    <circle cx="-2" cy="13" r="2" fill="#ffffff" />
    <path d="M 0,22 L 0,45" stroke="#d97706" stroke-width="2" stroke-linecap="round" />
    <circle cx="0" cy="50" r="3" fill="#d97706" />
  </g>
</svg>
