<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <radialGradient id="graphGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#060911" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="20" fill="#0b101d" stroke="#30363d" stroke-width="2" />
  <circle cx="64" cy="64" r="48" fill="url(#graphGlow)" />
  <!-- Graph Edges / Interconnecting Flows -->
  <path d="M 36,42 L 64,32 L 92,42 L 80,84 L 64,94 L 48,84 Z" stroke="#30363d" stroke-width="2" fill="none" />
  <line x1="64" y1="32" x2="64" y2="64" stroke="#4A90E2" stroke-width="2" stroke-dasharray="3 3" />
  <line x1="64" y1="64" x2="48" y2="84" stroke="#818cf8" stroke-width="2" />
  <line x1="64" y1="64" x2="80" y2="84" stroke="#ffd166" stroke-width="2" />
  <!-- Central Diamond Decision Node (HITL Approval Gate) -->
  <polygon points="64,52 76,64 64,76 52,64" fill="#ffd166" stroke="#ffffff" stroke-width="2" />
  <!-- Peripheral Cognitive Nodes -->
  <!-- Top Node (Input/Brief) -->
  <circle cx="64" cy="32" r="8" fill="#4A90E2" stroke="#ffffff" stroke-width="2" />
  <circle cx="64" cy="32" r="3" fill="#ffffff" />
  <!-- Left Node (Generator) -->
  <circle cx="36" cy="42" r="7" fill="#060911" stroke="#818cf8" stroke-width="2" />
  <circle cx="36" cy="42" r="2.5" fill="#818cf8" />
  <!-- Right Node (Evaluator) -->
  <circle cx="92" cy="42" r="7" fill="#060911" stroke="#4A90E2" stroke-width="2" />
  <circle cx="92" cy="42" r="2.5" fill="#4A90E2" />
  <!-- Bottom Left Node (Success) -->
  <circle cx="48" cy="84" r="7.5" fill="#34d399" stroke="#ffffff" stroke-width="2" />
  <!-- Bottom Right Node (Publish) -->
  <circle cx="80" cy="84" r="7.5" fill="#f43f5e" stroke="#ffffff" stroke-width="2" />
</svg>