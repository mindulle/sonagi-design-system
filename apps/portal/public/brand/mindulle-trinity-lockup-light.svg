<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="880" height="200" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&amp;family=JetBrains+Mono:wght@600&amp;family=Inter:wght@500;600&amp;display=swap');
      .lockup-title-light {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-weight: 700;
        font-size: 46px;
        letter-spacing: 0.16em;
        fill: #1c1514;
      }
      .lockup-tagline-light {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 0.24em;
        fill: #9a3412;
      }
      .lockup-product-light {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        font-weight: 500;
        font-size: 12px;
        letter-spacing: 0.12em;
        fill: #57534e;
      }
      .lockup-accent-light {
        fill: #b45309;
      }
      .lockup-rain-light {
        fill: #2563eb;
        font-weight: 600;
      }
    </style>

    <radialGradient id="lkGlassAuraLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#faf8f5" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="lkGoldCoreLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#9a3412" />
    </linearGradient>
  </defs>

  <!-- Warm Paper Canvas Base (#faf8f5) -->
  <rect width="880" height="200" rx="10" fill="#faf8f5" stroke="#1c1514" stroke-width="2" />

  <!-- Master Seal (Scaled 140x140 at left anchor) -->
  <g transform="translate(36, 30)">
    <!-- Base Disc -->
    <circle cx="70" cy="70" r="68" fill="#f5f0ea" stroke="#1c1514" stroke-width="2" />
    <circle cx="70" cy="70" r="68" fill="url(#lkGlassAuraLight)" />
    <!-- Secondary Dashed Rain Ring -->
    <circle cx="70" cy="70" r="62" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.8" />
    <circle cx="70" cy="70" r="44" stroke="#1c1514" stroke-width="1.5" />

    <!-- 8-Facet Glass Dome (Octagon) -->
    <polygon
      points="70,30 98,42 110,70 98,98 70,110 42,98 30,70 42,42"
      stroke="#2563eb"
      stroke-width="1.2"
      fill="none"
      opacity="0.5"
    />

    <!-- Dandelion Gold Core -->
    <circle cx="70" cy="70" r="16" fill="#faf8f5" stroke="#b45309" stroke-width="1.5" />
    <ellipse cx="70" cy="70" rx="5" ry="9" fill="url(#lkGoldCoreLight)" />
    <!-- 8 Parachute Plumes -->
    <line x1="70" y1="70" x2="70" y2="24" stroke="url(#lkGoldCoreLight)" stroke-width="1.5" />
    <line x1="70" y1="70" x2="70" y2="116" stroke="url(#lkGoldCoreLight)" stroke-width="1.5" />
    <line x1="70" y1="70" x2="24" y2="70" stroke="url(#lkGoldCoreLight)" stroke-width="1.5" />
    <line x1="70" y1="70" x2="116" y2="70" stroke="url(#lkGoldCoreLight)" stroke-width="1.5" />
    <line x1="70" y1="70" x2="38" y2="38" stroke="url(#lkGoldCoreLight)" stroke-width="1.2" />
    <line x1="70" y1="70" x2="102" y2="38" stroke="url(#lkGoldCoreLight)" stroke-width="1.2" />
    <line x1="70" y1="70" x2="102" y2="102" stroke="url(#lkGoldCoreLight)" stroke-width="1.2" />
    <line x1="70" y1="70" x2="38" y2="102" stroke="url(#lkGoldCoreLight)" stroke-width="1.2" />
    <!-- Little plume stars -->
    <circle cx="70" cy="24" r="2.5" fill="#d97706" />
    <circle cx="70" cy="116" r="2.5" fill="#d97706" />
    <circle cx="24" cy="70" r="2.5" fill="#d97706" />
    <circle cx="116" cy="70" r="2.5" fill="#d97706" />
    <circle cx="70" cy="70" r="3" fill="#ffffff" />
  </g>

  <!-- 2px Architectural Divider (The Trinity Anchor) -->
  <line x1="216" y1="40" x2="216" y2="160" stroke="#1c1514" stroke-width="2" />

  <!-- Typography Suite -->
  <!-- 1. Master Title -->
  <text x="246" y="86" class="lockup-title-light">
    MINDULLE <tspan class="lockup-accent-light">STUDIO</tspan>
  </text>

  <!-- 2. Soul & Harness Spec -->
  <text x="250" y="122" class="lockup-tagline-light">
    • SOUL &amp; HARNESS • EST. 2026 •
  </text>

  <!-- 3. Tooling Ecosystem Reference -->
  <text x="250" y="150" class="lockup-product-light">
    FEATURING <tspan class="lockup-rain-light">SONAGI TOOLING SUITE</tspan> • 2PX SCALED SYSTEM
  </text>
</svg>
