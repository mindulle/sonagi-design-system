<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" fill="none">
  <!-- Candidate 2: The Cascading 'S' (낙하하는 빗줄기 'S' 볼텍스) -->
  <rect width="400" height="400" rx="16" fill="#faf8f5" />

  <g transform="translate(200, 200)">
    <!-- Main Sweeping S-Curve (Cascading Rain Flow) -->
    <path d="M 35,-90 C -25,-90 -60,-55 -35,-15 C -15,18 45,25 35,65 C 25,100 -25,95 -45,75" 
          stroke="#1c1514" stroke-width="3.5" stroke-linecap="round" />

    <!-- Supporting Rain Stream (Blue #2563eb) -->
    <path d="M 50,-70 C 5,-70 -30,-40 -12,-5 C 5,25 55,30 45,85" 
          stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.8" />

    <!-- Seed Sparks Caught in Rain Cascade -->
    <circle cx="35" cy="-90" r="4.5" fill="#d97706" />
    <circle cx="-35" cy="-15" r="3.5" fill="#2563eb" />
    <circle cx="-45" cy="75" r="4.5" fill="#d97706" />
  </g>
</svg>
