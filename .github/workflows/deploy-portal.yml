name: Deploy Portal & Storybook

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  deploy:
    name: Build and Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write # PR에 Preview URL 코멘트를 남기기 위해 필요

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://npm.pkg.github.com'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Tokens & Portal
        run: pnpm run build

      - name: Build Storybook
        run: pnpm --filter @mindulle/ui build-storybook

      - name: Merge Storybook into Portal
        run: |
          mkdir -p apps/portal/dist/storybook
          cp -R packages/ui/storybook-static/* apps/portal/dist/storybook/

      - name: Install Wrangler globally
        run: npm install -g wrangler@3.90.0

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/portal/dist --project-name sonagi-design-system
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
