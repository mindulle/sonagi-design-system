name: Deploy Storybook

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  deploy:
    name: Build and Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write # PR에 Preview URL 코멘트를 남기기 위해 필요

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tokens
        run: pnpm run build

      - name: Install Wrangler globally
        run: npm install -g wrangler@3.90.0

      - name: Build Storybook
        run: pnpm --filter @mindulle/ui build-storybook

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy packages/ui/storybook-static --project-name sonagi-design-system # 프로젝트 이름이 다를 경우 수정 필요 (예: design-sonagi-space)
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
