name: Release

on:
  push:
    branches:
      - main

jobs:
  release-tokens:
    name: Release @mindulle/tokens
    runs-on: ubuntu-latest
    permissions:
      contents: write        # Git 커밋 및 태그 푸시 권한
      issues: write          # 이슈 코멘트 권한
      pull-requests: write   # PR 코멘트 권한
      id-token: write        # NPM provenance 지원용 (선택)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0              # semantic-release가 모든 커밋 기록을 분석할 수 있도록 설정
          persist-credentials: false  # semantic-release/git을 위해 필요

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build tokens
        run: pnpm --filter @mindulle/tokens build

      - name: Test build outputs
        run: pnpm --filter @mindulle/tokens test

      - name: Run Semantic Release
        working-directory: packages/tokens
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: HUSKY=0 npx semantic-release

  release-ui:
    name: Release @mindulle/ui
    runs-on: ubuntu-latest
    # release-tokens가 @semantic-release/git으로 main에 릴리스 커밋을 푸시하므로,
    # 병렬 실행 시 이 잡의 로컬 main이 뒤처져 "branch is behind the remote" 사유로
    # 릴리스가 조용히 스킵된다. 순차 실행하여 경쟁 조건을 제거한다.
    needs: release-tokens
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @mindulle/ui exec playwright install chromium --with-deps

      - name: Build tokens
        run: pnpm --filter @mindulle/tokens build

      - name: Build ui
        run: pnpm --filter @mindulle/tokens build && pnpm --filter @mindulle/ui build

      - name: Test ui
        run: pnpm --filter @mindulle/ui test

      - name: Run Semantic Release
        working-directory: packages/ui
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: HUSKY=0 npx semantic-release
